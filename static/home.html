<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Games</title>
<style>
  :root { --bg:#121417; --card:#1c1f24; --text:#e8e8e8; --border:#3a3f47; --accent:#5865f2; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 440px; padding: 24px 16px; text-align: center; }
  h1 { font-size: 1.5rem; }
  .pfp { width: 128px; height: 128px; border-radius: 50%; display: block; margin: 0 auto; }
  p { font-size: 1.1rem; line-height: 1.9; }
  .cmd { padding: 2px 8px; border: 2px solid var(--accent); border-radius: 6px; background: var(--card); font-family: ui-monospace, monospace; font-weight: 700; white-space: nowrap; }
</style>
</head>
<body>
<main>
  <img class="pfp" src="/static/rat.png" alt="the daily games rat">
  <h1>🐀 daily games</h1>
  <p>hey so u need to go to the discord and run <code class="cmd">/daily-games</code> in order to play lock in !</p>
</main>
</body>
</html>
